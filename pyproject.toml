[project]
name = "hypercomplex"
version = "0.1.0"
description = "Articles and verification code related to hypercomplex numbers (e.g., octonions)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "sympy>=1.14.0",
]

[project.scripts]
articles = "articles.__main__:main"
reftools = "reftools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/articles", "src/common", "src/reftools"]
